<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запис на зустріч</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f051d;
            --card-bg: rgba(30, 10, 60, 0.6);
            --neon-purple: #bc13fe;
            --light-purple: #e0d1ff;
            --glow: 0 0 15px rgba(188, 19, 254, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f051d 0%, #2e0b57 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light-purple);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(188, 19, 254, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--glow);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(188, 19, 254, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(224, 209, 255, 0.5);
        }

        input:focus, textarea:focus {
            border-color: var(--neon-purple);
            box-shadow: var(--glow);
            background: rgba(255, 255, 255, 0.1);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--glow);
        }

        button:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.8);
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .success { color: #00ff88; }
        .error { color: #ff4b2b; }

        /* Адаптивність */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Забронювати зустріч</h2>
    <form id="my-form" action="https://formspree.io/f/xppzjbkl" method="POST">
        <div class="form-group">
            <input type="text" name="name" placeholder="Ваше ім'я і фамілія" required>
        </div>
        
        <div class="form-group">
            <input type="text" name="contact" placeholder="Ваш телеграм юз або номер телефону" required>
        </div>
        
        <div class="form-group">
            <input type="text" name="datetime" placeholder="Дата 01.01 Час 12:00" required>
        </div>
        
        <div class="form-group">
            <textarea name="purpose" placeholder="Мета зустрічі" required></textarea>
        </div>
        
        <button id="my-form-button">Підтвердити</button>
        <p id="status"></p>
    </form>
</div>

<script>
    var form = document.getElementById("my-form");
    
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("status");
      var data = new FormData(event.target);
      var button = document.getElementById("my-form-button");

      button.disabled = true;
      button.innerText = "Відправка...";

      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          status.innerHTML = "Дякую! Запит надіслано.";
          status.className = "success";
          form.reset();
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
              status.innerHTML = "Ой! Сталася помилка при відправці.";
            }
            status.className = "error";
          })
        }
      }).catch(error => {
        status.innerHTML = "Ой! Сталася помилка з мережею.";
        status.className = "error";
      }).finally(() => {
        button.disabled = false;
        button.innerText = "Підтвердити";
      });
    }
    
    form.addEventListener("submit", handleSubmit)
</script>

</body>
</html>
